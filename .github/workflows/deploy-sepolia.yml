name: Sponsored Deploy to Sepolia (auto)

# Automatically deploys the contract to Sepolia whenever code is pushed to main.
# Requires these repository secrets to be set (Settings → Secrets → Actions):
#   SEPOLIA_RPC_URL   – e.g. https://sepolia.infura.io/v3/<key>
#   PRIVATE_KEY       – dedicated low-balance deployer/sponsor wallet private key
#   ETHERSCAN_API_KEY – for automatic source verification
# Gas is paid by the CI deployer/sponsor wallet, not by end users.

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/deploy.js"
      - "scripts/verify.js"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy contract → Sepolia
    runs-on: ubuntu-latest
    environment: sepolia
    permissions:
      contents: read
    concurrency:
      group: sponsored-deploy-sepolia
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Check required secrets
        id: secrets-check
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [ -z "$SEPOLIA_RPC_URL" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::SEPOLIA_RPC_URL and/or PRIVATE_KEY secrets are not set. Skipping deployment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Sepolia
        if: steps.secrets-check.outputs.skip == 'false'
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: npx hardhat run scripts/deploy.js --network sepolia

      - name: Verify on Etherscan
        if: steps.secrets-check.outputs.skip == 'false'
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: npx hardhat run scripts/verify.js --network sepolia
        # Verification can fail if Etherscan hasn't indexed the contract yet;
        # continue-on-error lets the workflow stay green in that case.
        continue-on-error: true
