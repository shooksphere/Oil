name: Deploy to Sepolia (auto)

# Automatically deploys both contracts to Sepolia whenever code is pushed to main.
# Requires these repository secrets to be set (Settings → Secrets → Actions):
#   SEPOLIA_RPC_URL   – e.g. https://sepolia.infura.io/v3/<key>
#   PRIVATE_KEY       – deployer wallet private key (no 0x prefix needed by hardhat)
#   ETHERSCAN_API_KEY – for automatic source verification

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/deploy.js"

jobs:
  deploy:
    name: Deploy contracts → Sepolia
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Deploy to Sepolia
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: npx hardhat run scripts/deploy.js --network sepolia

      - name: Verify on Etherscan
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: npx hardhat run scripts/verify.js --network sepolia
        # Verification can fail if Etherscan hasn't indexed the contract yet;
        # continue-on-error lets the workflow stay green in that case.
        continue-on-error: true
